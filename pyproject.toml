[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skills-manager"
version = "0.1.0"
description = "Manage generated and synced agent skills"
requires-python = ">=3.13"
dependencies = [
  "questionary>=2.1",
]

[project.scripts]
skills-manager = "skills_manager.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.ruff]
target-version = "py313"
exclude = ["skills", "sources", "vendor"]
